name: rbac-stage1

services:
  db:
    # 只通过服务网络供后端访问，不映射数据库主机端口；网络名 internal 本身不表示禁用外联。
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rbac}
      MYSQL_USER: ${MYSQL_USER:-rbac}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in deploy/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL 入口脚本仅在数据目录首次初始化时执行，保留旧卷重启不会自动重放迁移。
      - ../database/migrations/V001__create_core_tables.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [internal]
    healthcheck:
      # $$ 留给容器内 shell 展开，避免 Compose 在宿主机提前替换数据库凭据。
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h127.0.0.1 -u\"$${MYSQL_USER}\" \"$${MYSQL_DATABASE}\" -Nse 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 18
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-rbac}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-rbac}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in deploy/.env}
      RBAC_DEMO_ENABLED: ${RBAC_DEMO_ENABLED:-false}
      # 初始密码从本地环境传入；开启合成种子前还需确认目标数据库为空。
      RBAC_INITIAL_PASSWORD: ${RBAC_INITIAL_PASSWORD:-}
      # 显式传入空值，避免部署环境继承 application.yml 中仅供开发的 localhost:5173 白名单。
      # 同源请求不需额外配置；仅在确需跨域时填写可信客户端的精确 Origin。
      RBAC_ALLOWED_ORIGINS: ${RBAC_ALLOWED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 同源代理传递原访问协议，HTTPS 部署时 Cookie Secure 应与代理/TLS 配置配套。
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRINGDOC_SWAGGER_UI_URL: /api-design/openapi.yaml
      TZ: Asia/Shanghai
    depends_on:
      # service_healthy 等待数据库可查询，而不是只等 MySQL 容器进程启动。
      db:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    read_only: true
    # Java 临时目录单独挂载内存文件系统，业务数据写 MySQL 卷，不依赖容器可写层。
    tmpfs: [/tmp]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      # 唯一公开入口：静态原型与真实 API 同源，浏览器会话无需跨域共享 Cookie。
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  internal:
    driver: bridge

volumes:
  # down 默认保留命名卷；down --volumes 会删除数据库，不能用于正常升级或持久化验收。
  mysql_data:
