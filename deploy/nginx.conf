server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;
    # Docker changes service IPs on recreation. Resolve backend at request time
    # so a backend-only update does not require restarting this Nginx container.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $rbac_backend backend:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /health {
        proxy_pass http://$rbac_backend/api/v1/health;
    }
    # Preserve the original URL and HttpSession cookie on the same origin.
    location ~ ^/(api/v1(?:/|$)|swagger-ui(?:\.html|/)|v3/api-docs(?:/|$)) {
        proxy_pass http://$rbac_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api-design/ {
        types { application/yaml yaml; }
        default_type text/plain;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location /stage1/ {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
