server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 2m;
    # 后端容器重建可能更换 IP；使用 Docker DNS 并在请求时解析变量，避免代理持有失效地址。
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    set $rbac_backend backend:8080;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /nginx-health {
        # 仅证明 Nginx 自身可响应；数据库与业务后端就绪应检查 /api/v1/health。
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
    location = /health {
        proxy_pass http://$rbac_backend/api/v1/health;
    }
    # 保留完整请求路径和同源 JSESSIONID；API/Swagger 直接转发后端，不能被 SPA 首页兜底。
    location ~ ^/(api/v1(?:/|$)|swagger-ui(?:\.html|/)|v3/api-docs(?:/|$)) {
        proxy_pass http://$rbac_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api-design/ {
        # 权威静态契约单独发布，缺失时返回 404，避免把 HTML 首页误当 YAML。
        types { application/yaml yaml; }
        default_type text/plain;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }
    location /stage1/ {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        # 只有前端页面路由回退到 index.html，刷新深层 Vue 路由仍可加载应用。
        try_files $uri $uri/ /index.html;
    }
}
