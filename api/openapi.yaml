openapi: "3.0.3"
info:
  title: "RBAC Permission System — 第一阶段统一 API"
  version: "0.3.0"
  description: "第一阶段 RBAC0 契约：完整面向功能后端、完整可独立演示界面原型、API 设计及服务器运行交付。前缀 /api/v1；成功响应直接返回 JSON，不额外包 data；204 无响应体。用户 ID、部门 ID、角色 ID 均为字符串。Cookie 会话 JSESSIONID，后端逐请求验证账号、启用角色、权限及数据范围，前端身份和权限不可信。首次登录/重置后未改密仅允许 GET /me、PATCH /me/password、POST /auth/logout，其余 403 PASSWORD_CHANGE_REQUIRED。对象检查顺序为认证→权限→数据范围→目标；未授予默认拒绝。账号类别不属于需求，不存在 accountType 字段。实际测试与部署状态见 docs/stage1/verification-record.md；契约定义不是通过验收的证据。"
servers:
  -
    url: "/api/v1"
    description: "同源部署；本地后端默认 http://localhost:8080/api/v1"
tags:
  -
    name: "认证"
  -
    name: "本人"
  -
    name: "门户"
  -
    name: "员工台账"
  -
    name: "用户"
  -
    name: "部门"
  -
    name: "角色"
  -
    name: "授权"
  -
    name: "目录"
x-admin-permission-mapping:
  -
    source: "sys:f339:read"
    derived:
      - "rbac:user:read"
  -
    source: "sys:f339:create"
    derived:
      - "rbac:user:create"
  -
    source: "sys:f339:edit"
    derived:
      - "rbac:user:update"
      - "rbac:user:assign-role"
  -
    source: "sys:f339:delete"
    derived:
      - "rbac:user:delete"
  -
    source: "sys:f340:read"
    derived:
      - "rbac:role:read"
  -
    source: "sys:f340:create"
    derived:
      - "rbac:role:create"
  -
    source: "sys:f340:edit"
    derived:
      - "rbac:role:update"
  -
    source: "sys:f340:delete"
    derived:
      - "rbac:role:delete"
  -
    source: "sys:f341:read"
    derived:
      - "rbac:permission:read"
  -
    source: "sys:f341:edit"
    derived:
      - "rbac:role:grant"
  -
    source: "sys:f342:read"
    derived:
      - "rbac:department:read"
  -
    source: "sys:f348:read"
    derived:
      - "rbac:log:read"
  -
    source: "sys:f348:export"
    derived:
      - "rbac:log:export"
  -
    source: "sys:f349:read"
    derived:
      - "rbac:log:read"
  -
    source: "sys:f349:export"
    derived:
      - "rbac:log:export"
x-scope-merge: "同码 ALL > DEPT > SELF；不同码独立；rbac 映射继承源清单权限范围。"
x-phase-boundary: "阶段二角色继承、阶段三 SSD/DSD/基数/审计日志接口不在本契约内。日志映射预留但阶段一不提供日志业务接口。"
paths:
  "/auth/login":
    post:
      tags:
        - "认证"
      summary: "工号或手机号登录"
      operationId: "post_auth_login"
      x-required-permission: "none"
      security: []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      description: "成功轮换 JSESSIONID；Cookie HttpOnly、SameSite=Lax。第一阶段所有已分配且启用的角色生效。用户不存在、密码错误、停用、锁定一律 401 INVALID_CREDENTIALS / 用户名或密码错误。须改密时仍建立受限会话。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  "/auth/logout":
    post:
      tags:
        - "认证"
      summary: "退出并使旧会话失效"
      operationId: "post_auth_logout"
      x-required-permission: "none"
      description: "退出后原 JSESSIONID 访问受保护接口返回 401。退出要求有效登录；无效会话返回 401。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  "/me":
    get:
      tags:
        - "本人"
      summary: "当前用户"
      operationId: "get_me"
      x-required-permission: "none"
      description: "首次改密受限会话允许调用；不返回密码或哈希。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  "/me/password":
    patch:
      tags:
        - "本人"
      summary: "校验旧密码并修改本人密码"
      operationId: "patch_me_password"
      x-required-permission: "none"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/PasswordRequest"
      description: "首次登录与密码重置后必须使用此接口改密。旧密码错误 400 BAD_OLD_PASSWORD；新密码 8–128 字符且须与旧密码不同。成功清除 mustChangePassword，当前会话保留，其他旧密码会话失效。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
  "/me/permissions":
    get:
      tags:
        - "本人"
      summary: "当前有效权限、范围及来源角色"
      operationId: "get_me_permissions"
      x-required-permission: "none"
      description: "与后端鉴权共用计算结果；无角色返回空数组。version 为当前用户角色集合版本，只用于展示，不能用于角色授权保存。角色/授权/停用变化于下一次请求生效。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/MyPermissions"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/portal/menu":
    get:
      tags:
        - "门户"
      summary: "按查看权限返回系统、模块、功能点树"
      operationId: "get_portal_menu"
      x-required-permission: "none"
      description: "仅包含拥有对应 read 权限的功能点，空模块和空系统不返回。没有启用角色时为空数组。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MenuSystem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  "/portal/functions/{functionCode}":
    get:
      tags:
        - "门户"
      summary: "功能占位页及六个操作状态"
      operationId: "get_portal_functions_functionCode"
      x-required-permission: "{systemCode}:{functionCode}:read"
      parameters:
        -
          name: "functionCode"
          in: "path"
          required: true
          schema:
            type: "string"
      description: "按功能点对应 read 权限校验。actions 固定包含六个动作；无权动作 enabled=false、scope=null。占位动作不产生业务变更。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Function"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  "/ledger/employees":
    get:
      tags:
        - "员工台账"
      summary: "按查看范围分页查询员工"
      operationId: "get_ledger_employees"
      x-required-permission: "hr:f046:read"
      parameters:
        -
          name: "keyword"
          in: "query"
          description: "按工号、姓名等关键词筛选"
          schema:
            type: "string"
        -
          name: "departmentId"
          in: "query"
          description: "筛选该部门及全部下级，不扩大已有查看范围"
          schema:
            type: "string"
        -
          name: "page"
          in: "query"
          description: "从 1 开始"
          schema:
            type: "integer"
            minimum: 1
            default: 1
        -
          name: "pageSize"
          in: "query"
          description: "每页条数，最大 100"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      description: "由 hr:f046:read 的范围裁剪；编辑另由 hr:f046:edit 对目标检查。前端从 /me/permissions 获取对应范围计算按钮状态，列表不返回 editable/readScope/editScope。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/EmployeePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/ledger/employees/{id}":
    patch:
      tags:
        - "员工台账"
      summary: "按编辑范围修改电话、邮箱"
      operationId: "patch_ledger_employees_id"
      x-required-permission: "hr:f046:edit"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/EmployeeContact"
      description: "只能传 phone、email。其他字段 400 FIELD_NOT_EDITABLE；目标不存在或范围外统一 403 OUT_OF_SCOPE 且不泄露对象资料。新增/删除/审批/导出为原型占位，不提供接口。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Employee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/users":
    get:
      tags:
        - "用户"
      summary: "筛选管理范围内的用户"
      operationId: "get_users"
      x-required-permission: "rbac:user:read"
      parameters:
        -
          name: "keyword"
          in: "query"
          description: "按工号、姓名等关键词筛选"
          schema:
            type: "string"
        -
          name: "departmentId"
          in: "query"
          description: "包含全部下级；范围外筛选返回空结果"
          schema:
            type: "string"
        -
          name: "roleId"
          in: "query"
          description: "角色 ID"
          schema:
            type: "string"
        -
          name: "username"
          in: "query"
          description: "工号关键词"
          schema:
            type: "string"
        -
          name: "name"
          in: "query"
          description: "姓名关键词"
          schema:
            type: "string"
        -
          name: "page"
          in: "query"
          description: "从 1 开始"
          schema:
            type: "integer"
            minimum: 1
            default: 1
        -
          name: "pageSize"
          in: "query"
          description: "每页条数，最大 100"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      description: "先按权限范围过滤，再筛选、统计和分页；不会因篡改部门或角色参数扩大范围。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags:
        - "用户"
      summary: "新增用户，不同时分配角色"
      operationId: "post_users"
      x-required-permission: "rbac:user:create"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/CreateUser"
      description: "工号唯一；phone 可空，非空唯一。初始密码来自部署配置，不从请求接受，不在响应返回。新账号 mustChangePassword=true。角色通过独立整组替换接口分配。新部门必须在管理范围内；SELF不能用于创建其他账号，返回403 OUT_OF_SCOPE。"
      responses:
        "201":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/users/{id}":
    get:
      tags:
        - "用户"
      summary: "查看范围内用户详情"
      operationId: "get_users_id"
      x-required-permission: "rbac:user:read"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      description: "目标不存在或范围外统一 403 OUT_OF_SCOPE。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "用户"
      summary: "编辑用户基本信息"
      operationId: "put_users_id"
      x-required-permission: "rbac:user:update"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UpdateUser"
      description: "目标用户及修改后的部门都必须在管理范围内；工号不可改。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - "用户"
      summary: "删除用户并清理关联"
      operationId: "delete_users_id"
      x-required-permission: "rbac:user:delete"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      description: "角色关联级联删除；其担任负责人的部门 manager_user_id 置空。不能删除自己或唯一 admin，409 PROTECTED_ACCOUNT。"
      responses:
        "204":
          description: "成功"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/users/{id}/status":
    patch:
      tags:
        - "用户"
      summary: "启用或停用用户"
      operationId: "patch_users_id_status"
      x-required-permission: "rbac:user:update"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/UserStatusRequest"
      description: "不能停用自己或唯一 admin。停用后该用户既有会话在下一次请求返回 401。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/users/{id}/password-reset":
    post:
      tags:
        - "用户"
      summary: "重置密码并要求首次改密"
      operationId: "post_users_id_password_reset"
      x-required-permission: "rbac:user:update"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      description: "恢复部署配置的初始密码；不接受明文密码输入、不返回密码。清除/限制既有会话，后续登录 mustChangePassword=true。本人改密应使用 /me/password。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/users/{id}/roles":
    get:
      tags:
        - "授权"
      summary: "读取用户完整角色集合和版本"
      operationId: "get_users_id_roles"
      x-required-permission: "rbac:user:read"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      description: "按 rbac:user:read 的范围检查目标。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserRoles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags:
        - "授权"
      summary: "带版本号整组替换用户角色"
      operationId: "put_users_id_roles"
      x-required-permission: "rbac:user:assign-role"
      parameters:
        -
          name: "id"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ReplaceUserRoles"
      description: "空 roleIds 撤销全部。重复项 400。version 必须等于当前 role_version，成功原子替换并 +1；旧版 409 VERSION_CONFLICT。不能改自己或 admin 的角色。ADMIN 不能授给他人；部门管理员仅可增删本部门及下级用户的业务角色，不可增删管理类角色。已有角色/授权的变更下一次请求生效。"
      responses:
        "200":
          description: "成功"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/UserRoles"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  "/departments":
    get:
      tags:
        - "部门"
      summary: "查询管理范围内的只读部门树"
      operationId: "get_departments"
      x-required-permission: "rbac:department:read"
