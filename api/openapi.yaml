          type: string
        roleIds:
          type: array
          uniqueItems: true
          items:
            type: string
        version:
          type: integer
          minimum: 0
    ReplaceUserRolesRequest:
      type: object
      required: [roleIds, version]
      additionalProperties: false
      properties:
