components:
  securitySchemes:
    sessionCookie:
      type: "apiKey"
      in: "cookie"
      name: "JSESSIONID"
      description: "服务端 HttpSession；HttpOnly、SameSite=Lax，HTTPS 部署启用 Secure。客户端自动发送同源 Cookie。"
  responses:
    BadRequest:
      description: "参数错误。VALIDATION、BAD_OLD_PASSWORD、FIELD_NOT_EDITABLE、UNKNOWN_PERMISSION 或 READ_REQUIRED。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: "401 UNAUTHENTICATED：未登录、会话失效、用户已停用或删除。登录失败使用 INVALID_CREDENTIALS，提示统一为“用户名或密码错误”。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: "403 FORBIDDEN（缺权限/禁止授予管理角色）、OUT_OF_SCOPE（范围外与不存在统一）、PASSWORD_CHANGE_REQUIRED（须先修改密码）。OUT_OF_SCOPE 不携带目标字段。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: "404 NOT_FOUND：不存在的角色或目录对象。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: "409 VERSION_CONFLICT、PROTECTED_ACCOUNT、PROTECTED_ROLE、ROLE_HAS_USERS、DUPLICATE_USERNAME、DUPLICATE_PHONE 或 DUPLICATE_ROLE_CODE。版本冲突 details.currentVersion；角色仍有用户 details.userCount。所有冲突均不产生部分写入。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: "服务端失败，不返回堆栈或秘密。事务整体回滚。"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Scope:
      type: "string"
      enum:
        - "ALL"
        - "DEPT"
        - "SELF"
      description: "ALL 全部；DEPT 当前用户所在部门及其全部下级；SELF 当前用户。多个角色对同一权限码取最大范围，ALL > DEPT > SELF，不跨权限码合并。"
    Status:
      type: "string"
      enum:
        - "ENABLED"
        - "DISABLED"
    Action:
      type: "string"
      enum:
        - "read"
        - "create"
        - "edit"
        - "approve"
        - "export"
        - "delete"
    PermissionCode:
      type: "string"
      pattern: "^(?:[a-z0-9]{2,16}:f[0-9]{3}:(?:read|create|edit|approve|export|delete)|rbac:[a-z]+:[a-z-]+)$"
      example: "hr:f046:edit"
      description: "稳定权限码。rbac:* 仅为后端派生，不能作为角色直接授权的输入。"
    Grant:
      type: "object"
      required:
        - "code"
        - "scope"
      additionalProperties: false
      properties:
        code:
          $ref: "#/components/schemas/PermissionCode"
        scope:
          $ref: "#/components/schemas/Scope"
    RoleSource:
      type: "object"
      required:
        - "id"
        - "code"
        - "name"
      properties:
        id:
          type: "string"
          description: "数据库主键在 HTTP 中以字符串传输"
        code:
          type: "string"
        name:
          type: "string"
    PermissionScope:
      type: "object"
      required:
        - "permissionCode"
        - "scope"
        - "roles"
      properties:
        permissionCode:
          $ref: "#/components/schemas/PermissionCode"
        scope:
          $ref: "#/components/schemas/Scope"
        roles:
          type: "array"
          items:
            $ref: "#/components/schemas/RoleSource"
    User:
      type: "object"
      required:
        - "id"
        - "username"
        - "name"
        - "departmentId"
        - "status"
        - "mustChangePassword"
      properties:
        id:
          type: "string"
          description: "数据库主键在 HTTP 中以字符串传输"
        username:
          type: "string"
          maxLength: 32
        name:
          type: "string"
          maxLength: 32
        departmentId:
          type: "string"
          description: "数据库主键在 HTTP 中以字符串传输"
        departmentName:
          type: "string"
        position:
          type: "string"
          maxLength: 32
          nullable: true
        phone:
          type: "string"
          maxLength: 20
          nullable: true
        email:
          type: "string"
          maxLength: 64
          nullable: true
        status:
          $ref: "#/components/schemas/Status"
        mustChangePassword:
          type: "boolean"
        roleIds:
          type: "array"
          items:
            type: "string"
            description: "数据库主键在 HTTP 中以字符串传输"
        roleVersion:
          type: "integer"
          minimum: 0
    UserPage:
      type: "object"
      required:
        - "items"
        - "page"
        - "pageSize"
        - "total"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/User"
        page:
          type: "integer"
          minimum: 1
        pageSize:
          type: "integer"
          minimum: 1
          maximum: 100
        total:
          type: "integer"
          minimum: 0
    CurrentUser:
