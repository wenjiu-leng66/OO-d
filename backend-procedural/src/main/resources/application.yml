spring:
  application:
    name: rbac-procedural-backend
  datasource:
    # 默认使用 H2 内存库，无需安装 MySQL 即可运行。
    # 切 MySQL 时改为 jdbc:mysql://localhost:3306/rbac?useUnicode=true&characterEncoding=utf8
    url: jdbc:h2:mem:rbac;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    root: info
