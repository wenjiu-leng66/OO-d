# 通用运行配置。默认 h2 只用于本地检查；服务器需显式启用 mysql profile。
# HttpOnly/SameSite 管理会话 Cookie，HTTPS 部署时应设置 SESSION_COOKIE_SECURE=true。
spring:
  application:
    name: rbac-procedural-backend
  profiles:
    default: h2
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  forward-headers-strategy: framework
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
rbac:
  demo-enabled: ${RBAC_DEMO_ENABLED:false}
  initial-password: ${RBAC_INITIAL_PASSWORD:}
  allowed-origins: ${RBAC_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}


springdoc:
  swagger-ui:
    query-config-enabled: true
